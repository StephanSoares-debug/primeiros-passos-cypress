name: CI

on: [push]
jobs: 
    build-test:
        runs-on: ubuntu-24.04
        steps: 
            
            - name: Checkout
              uses: actions/checkout@v7

            - name: Cypress Tests
              uses: cypress-io/github-action@v7
              with:
                start: 'npm run dev'
                build: 'npm run build'
            - uses: actions/upload-artifact@v4             
              if: always()
              with:
                    name: Cypress Results
                    path: |    
                        cypress/screenshots
                        cypress/videos
                        cypress/results            
                    if-no-files-found: ignore
